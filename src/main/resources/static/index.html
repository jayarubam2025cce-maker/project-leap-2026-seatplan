<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SeatPlan - Exam Hall Seating Arrangement Generator</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .cancel-btn {
            background: #6b7280;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #1f2937;
            color: white;
        }

        tr:nth-child(even) {
            background: #f9fafb;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>
</head>

<body>

<header>

    <h1>SEATPLAN</h1>

    <p>Exam Hall Seating Arrangement Generator</p>

</header>


<div class="container">

    <!-- STUDENT FORM -->

    <div class="card">

        <h2>Student Management</h2>

        <form id="studentForm">

            <div class="form-group">

                <label>Student Name</label>

                <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required>

            </div>


            <div class="form-group">

                <label>Register Number</label>

                <input
                        type="text"
                        id="registerNumber"
                        placeholder="Enter register number"
                        required>

            </div>


            <div class="form-group">

                <label>Department</label>

                <input
                        type="text"
                        id="department"
                        placeholder="Enter department"
                        required>

            </div>


            <button
                    type="submit"
                    class="add-btn"
                    id="submitButton">

                Add Student

            </button>


            <button
                    type="button"
                    class="cancel-btn"
                    id="cancelButton"
                    style="display:none;">

                Cancel

            </button>

        </form>


        <p id="message"></p>

    </div>


    <!-- STUDENT TABLE -->

    <div class="card">

        <h2>Student List</h2>

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Register Number</th>

                <th>Department</th>

                <th>Actions</th>

            </tr>

            </thead>


            <tbody id="studentTable">

            </tbody>

        </table>

    </div>

</div>


<script>

    const API_URL = "/api/students";

    let editingId = null;


    // LOAD STUDENTS

    function loadStudents() {

        fetch(API_URL)

            .then(response => response.json())

            .then(students => {

                const table = document.getElementById("studentTable");

                table.innerHTML = "";


                students.forEach(student => {

                    const row = document.createElement("tr");

                    row.innerHTML = `

                        <td>${student.id}</td>

                        <td>${student.name}</td>

                        <td>${student.registerNumber}</td>

                        <td>${student.department}</td>

                        <td>

                            <button
                                class="edit-btn"
                                onclick="editStudent(
                                    ${student.id},
                                    '${student.name}',
                                    '${student.registerNumber}',
                                    '${student.department}'
                                )">

                                Edit

                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteStudent(${student.id})">

                                Delete

                            </button>

                        </td>

                    `;

                    table.appendChild(row);

                });

            })

            .catch(error => {

                console.error(error);

            });

    }


    // ADD / UPDATE STUDENT

    document.getElementById("studentForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const student = {

                name: document.getElementById("name").value,

                registerNumber:
                document.getElementById("registerNumber").value,

                department:
                document.getElementById("department").value

            };


            let url = API_URL;

            let method = "POST";


            if (editingId !== null) {

                url = `${API_URL}/${editingId}`;

                method = "PUT";

            }


            fetch(url, {

                method: method,

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify(student)

            })

                .then(response => {

                    if (!response.ok) {

                        throw new Error("Operation failed");

                    }

                    return response.json();

                })

                .then(data => {

                    document.getElementById("message")
                        .innerText =
                        editingId === null
                            ? "Student added successfully!"
                            : "Student updated successfully!";


                    resetForm();

                    loadStudents();

                })

                .catch(error => {

                    document.getElementById("message")
                        .innerText =
                        "Error: " + error.message;

                });

        });


    // EDIT STUDENT

    function editStudent(id, name, registerNumber, department) {

        editingId = id;


        document.getElementById("name").value = name;

        document.getElementById("registerNumber").value =
            registerNumber;

        document.getElementById("department").value =
            department;


        document.getElementById("submitButton")
            .innerText = "Update Student";


        document.getElementById("cancelButton")
            .style.display = "inline-block";

    }


    // DELETE STUDENT

    function deleteStudent(id) {

        if (!confirm("Are you sure you want to delete this student?")) {

            return;

        }


        fetch(`${API_URL}/${id}`, {

            method: "DELETE"

        })

            .then(response => {

                if (!response.ok) {

                    throw new Error("Delete failed");

                }

                return response.text();

            })

            .then(message => {

                document.getElementById("message")
                    .innerText = message;

                loadStudents();

            })

            .catch(error => {

                document.getElementById("message")
                    .innerText =
                    "Error: " + error.message;

            });

    }


    // RESET FORM

    function resetForm() {

        editingId = null;

        document.getElementById("studentForm").reset();

        document.getElementById("submitButton")
            .innerText = "Add Student";

        document.getElementById("cancelButton")
            .style.display = "none";

    }


    // CANCEL UPDATE

    document.getElementById("cancelButton")
        .addEventListener("click", function() {

            resetForm();

        });


    // LOAD DATA WHEN PAGE OPENS

    loadStudents();

</script>

</body>
</html>
